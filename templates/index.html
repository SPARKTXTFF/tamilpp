<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TamilPP IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="ide-container">
        <div class="panel editor-panel">
            <div class="toolbar title-bar">
                <h1>🐍 TamilPP IDE</h1>
                <a href="/docs" target="_blank" class="action-btn" style="background-color: #414868; text-decoration: none; font-size: 13px;">📖 Docs</a>
                <div class="controls">
                    <select id="langSelect">
                        <option value="tamil">Tamil / Tanglish</option>
                        <option value="hindi">Hindi</option>
                        <option value="telugu">Telugu</option>
                    </select>
                </div>
            </div>
            <div class="toolbar action-bar">
                <div class="tab">main.tpp</div>
                <div class="controls">
                    <button class="action-btn download-btn" onclick="downloadCode()">Save</button>
                    <button class="action-btn run-btn" onclick="runCode()">Run</button>
                </div>
            </div>
            <div class="editor-wrapper">
                <textarea id="codeEditor"># உங்கள் குறிமுறையை இங்கே எழுதவும்
பதி("வணக்கம் உலகம்!")</textarea>
            </div>
        </div>

        <div class="panel output-panel">
            <div class="toolbar">
                <div class="tab">Output</div>
                <div class="controls">
                    <button class="action-btn clear-btn" onclick="clearOutput()">Clear</button>
                </div>
            </div>
            <div class="output-wrapper">
                <pre id="output"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
