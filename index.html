<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TamilPP IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="ide-container">
        <div class="panel editor-panel">
            <div class="toolbar title-bar">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <a href="/docs.html" target="_blank" class="action-btn" style="background-color: #414868; text-decoration: none; font-size: 13px;">📖 Docs</a>
                    <h1>🐍 TamilPP IDE</h1>
                </div>
                <div class="controls">
                    <select id="langSelect">
                        <option value="tamil">Tamil / Tanglish</option>
                    </select>
                </div>
            </div>
            <div class="toolbar action-bar">
                <div class="tab">main.tpp</div>
                <div class="controls">
                    <button class="action-btn run-btn" id="runBtn" onclick="runCode()">Loading Engine...</button>
                </div>
            </div>
            <div class="editor-wrapper">
                <textarea id="codeEditor">பயனர்_பெயர் = உள்ளிடு("உங்கள் பெயர் என்ன? ")
பதி("வணக்கம்", பயனர்_பெயர்)</textarea>
            </div>
        </div>

        <div class="panel output-panel">
            <div class="toolbar">
                <div class="tab">Interactive Terminal</div>
                <div class="controls">
                    <button class="action-btn clear-btn" onclick="clearTerminal()">Clear</button>
                </div>
            </div>
            
            <div class="output-wrapper custom-terminal" id="terminal-container" onclick="focusTerminal()">
                <div id="term-output"></div>
                <div id="term-input-line" style="display: none;">
                    <span id="term-prompt"></span>
                    <input type="text" id="term-input" autocomplete="off" spellcheck="false">
                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
